<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POA 발송</title><link rel="icon" href="/pumex/1_assets/1_image/favicon.png" type="image/png"><link rel="stylesheet" href="/pumex/2_common/1_css/color.css"><link rel="stylesheet" href="/pumex/2_common/1_css/common.css"><link rel="stylesheet" href="style.css?v=20261127-dropdown"><script src="/pumex/2_common/2_js/login.js"></script><script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script></head><body><div id="desktop-header-placeholder"></div><main class="page" hidden><header><span class="eyebrow">PUMEX · PARTNER MAIL</span><h1>POA 발송</h1><p>고객 정보와 한국 주소를 확인한 후 메일을 작성하세요.</p></header><section class="panel"><h2>파트너 선택</h2><div class="grid partner-grid"><label>미국 파트너<select id="partner"><option value="">파트너 목록을 불러오는 중...</option></select></label><label>파트너 이메일<input id="to" type="email" placeholder="파트너 선택 시 자동 입력"></label></div><input id="cc" type="hidden"><p id="partner-status" class="note" role="status"></p></section><section class="panel"><div class="section-head"><div><h2>고객 정보</h2><p>고객을 검색해서 선택하세요. 최대 3명까지 추가할 수 있습니다.</p></div><button type="button" class="secondary" id="add">＋ 고객 추가</button></div><div id="customers"></div></section><section class="panel"><h2>메일 내용 미리보기</h2><label>메일 제목<input id="subject" readonly placeholder="고객을 선택하면 자동으로 생성됩니다"></label><p class="note">메일 작성 버튼을 누르면 표가 서식과 함께 복사됩니다. 새 메일의 본문에 붙여넣어 주세요.</p><div id="preview" class="preview"></div><button type="button" class="primary" id="compose">메일 작성</button><p id="status" class="status" role="status" aria-live="polite"></p></section></main><script src="/pumex/2_common/2_js/loading.js"></script><script src="app.js?v=20261127-poa-auth"></script></body></html>
