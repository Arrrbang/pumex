<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISF 서류 생성 | P.A.S.S</title>
<link rel="icon" href="/pumex/1_assets/1_image/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pumex/2_common/1_css/color.css"><link rel="stylesheet" href="/pumex/2_common/1_css/common.css"><link rel="stylesheet" href="./isf.css?v=20261119-forwarders"><script src="/pumex/2_common/2_js/login.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script><script src="./isf.js?v=20261119-forwarders" defer></script></head>
<body><div id="desktop-header-placeholder"></div><main class="booking-page isf-page"><header class="page-heading"><div class="page-title"><h1>ISF 서류 생성</h1><p>HBL을 확인하고 파트너별 ISF 양식을 만들어 보세요.</p></div></header>
<form id="isfForm"><section class="booking-card"><div class="section-heading"><span class="step-number">01</span><h2>HBL 파일 업로드</h2></div><div id="dropzone" class="dropzone"><span class="upload-icon" aria-hidden="true">↑</span><strong>HBL PDF를 여기에 끌어다 놓으세요</strong><span>또는 파일을 직접 선택해 주세요. PDF 1~2개</span><label class="file-button" for="pdfs">파일 선택</label><input type="file" id="pdfs" accept="application/pdf,.pdf" multiple required><div class="upload-list" id="uploadedList" hidden><div class="upload-list-heading"><strong>업로드된 파일</strong><span id="fileCount"></span></div><div class="upload-list-columns" aria-hidden="true"><span>파일명</span><span>파일 크기</span><span></span></div><ul id="selectedFiles" class="file-list" aria-label="업로드된 HBL 파일"></ul></div></div><p id="status" class="status-text" role="status" aria-live="polite"></p></section>
<section class="booking-card"><div class="section-heading"><span class="step-number">02</span><h2>선적 정보</h2></div><p class="section-intro">파트너와 포워딩을 선택하고 공통 선적 정보를 확인해 주세요.</p><div class="grid"><label>파트너<select id="partner" required><option value="">파트너를 선택하세요</option><option value="HI-TEK">HI-TEK</option><option value="KEYWORD">KEYWORD</option><option value="KT (ATLANTA)">KT (ATLANTA)</option><option value="SOS (CHICAGO)">SOS (CHICAGO)</option><option value="SOS (ATLANTA)">SOS (ATLANTA)</option><option value="SOS (SAVANNAH)">SOS (SAVANNAH)</option><option value="SOS (DALLAS)">SOS (DALLAS)</option></select></label><label>포워딩<select id="forwarder" required><option value="">포워딩을 선택하세요</option><option value="주성">주성 (JSSY)</option><option value="람세스">람세스 (RLCL)</option><option value="중앙">중앙 (CEPV)</option><option value="티엔케이">티엔케이 (GGBO)</option><option value="로지피아">로지피아 (LCFF)</option></select></label><label>MBL 번호<input id="mbl" required autocomplete="off" placeholder="MBL 번호 입력"></label></div><div class="grid shipping-schedule"><label>ETD<input id="etd" type="text" inputmode="numeric" autocomplete="off" maxlength="8" pattern="[0-9]{8}" placeholder="YYYYMMDD (예: 20261119)" title="날짜를 8자리 숫자로 입력해 주세요." required></label><label id="etaLabel">ETA<input id="eta" type="text" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="off" placeholder="YYYYMMDD (예: 20261119)"></label><label>선명<input id="vessel" required placeholder="선명 확인"></label><label>항차<input id="voyage" required placeholder="항차 확인"></label></div></section>
<section class="booking-card"><div class="section-heading"><span class="step-number">03</span><h2>HBL 정보 확인</h2></div><p class="section-intro">PDF에서 읽은 내용을 확인하고 필요한 부분을 수정해 주세요.</p><div id="people"><div class="empty-state">HBL 파일을 업로드하면 이곳에 정보가 표시됩니다.</div></div></section><div class="actions"><button id="generate" type="submit" disabled>엑셀 다운로드</button></div><p id="result" class="result" role="status" aria-live="polite"></p></form></main><script src="/pumex/2_common/2_js/loading.js"></script></body></html>
