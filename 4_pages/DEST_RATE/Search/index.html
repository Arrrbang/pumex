<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P.A.S.S | DEST_RATE</title>
<link rel="icon" href="/pumex/1_assets/1_image/favicon.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../2_common/1_css/common.css">
<link rel="stylesheet" href="../../../2_common/1_css/color.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css">
<link rel="stylesheet" href="./dest_rate.css">
<script src="/pumex/2_common/2_js/login.js"></script>
</head>
<body>
<div id="desktop-header-placeholder" class="desktop-only"></div>
<main class="app-shell"><div class="app-main">
<section class="left-pane"><div id="mpkMap" class="map-canvas" aria-label="배송지역 지도"></div></section>
<section class="right-pane" aria-label="국가 및 배송지역 선택">
<div class="dest-form">
<section class="dest-group" id="locationGroup" aria-labelledby="locationGroupTitle"><h2 id="locationGroupTitle"><span>01</span>국가 · 배송지역</h2>
<div class="dest-field" id="countryField">
<label class="dropdown-label" for="countryInput">국가</label>
<div class="combo" id="countryCombo"><span class="combo-spinner" aria-hidden="true"></span><input id="countryInput" type="text" placeholder="선택하세요" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="countryList" disabled><div id="countryList" class="list" role="listbox"></div></div>
</div>
<div class="dest-field" id="regionField" hidden>
<label class="dropdown-label" for="regionInput">배송지역</label>
<div class="combo" id="regionCombo"><span class="combo-spinner" aria-hidden="true"></span><input id="regionInput" type="text" placeholder="선택하세요" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="regionList" disabled><div id="regionList" class="list" role="listbox"></div></div>
</div></section>
<section class="dest-group" id="tariffGroup" aria-labelledby="tariffGroupTitle" hidden><h2 id="tariffGroupTitle"><span>02</span>파트너 · 운송 조건</h2>
<div class="dest-field" id="companyField" hidden>
<label class="dropdown-label" for="companyInput">파트너</label>
<div class="combo" id="companyCombo"><span class="combo-spinner" aria-hidden="true"></span><input id="companyInput" type="text" placeholder="선택하세요" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="companyList" disabled><div id="companyList" class="list" role="listbox"></div></div>
</div>
<div class="dest-field" id="cargoField" hidden>
<label class="dropdown-label" for="cargoInput">화물타입</label>
<div class="combo" id="cargoCombo"><span class="combo-spinner" aria-hidden="true"></span><input id="cargoInput" type="text" placeholder="선택하세요" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cargoList" disabled><div id="cargoList" class="list" role="listbox"></div></div>
</div>
</section>
<section class="dest-group" id="sizeGroup" aria-labelledby="sizeGroupTitle" hidden><h2 id="sizeGroupTitle"><span>03</span>컨테이너 · 도착항구 · 물량</h2>
<div class="dest-field" id="containerField" hidden>
<label class="dropdown-label" for="containerInput">컨테이너 타입</label>
<div class="combo" id="containerCombo"><span class="combo-spinner" aria-hidden="true"></span><input id="containerInput" type="text" placeholder="선택하세요" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="containerList" disabled><div id="containerList" class="list" role="listbox"></div></div>
</div>
<div class="dest-field" id="poeField" hidden>
<label class="dropdown-label" for="poeInput">도착항구 (POE)</label>
<div class="combo" id="poeCombo"><span class="combo-spinner" aria-hidden="true"></span><input id="poeInput" type="text" placeholder="선택하세요" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="poeList" disabled><div id="poeList" class="list" role="listbox"></div></div>
</div>
<div class="dest-field" id="cbmField" hidden>
<label class="dropdown-label" for="cbmInput">CBM</label>
<div class="combo" id="cbmCombo"><span class="combo-spinner" aria-hidden="true"></span><input id="cbmInput" type="text" placeholder="선택하세요" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cbmList" disabled><div id="cbmList" class="list" role="listbox"></div></div>
</div></section>
<div class="dest-query-action"><button id="destQueryButton" class="primary-btn" type="button" hidden><span class="label">조회</span></button></div>
<div class="dest-form-feedback"><p id="selectionStatus" class="dest-status" role="status" aria-live="polite"></p>
<button id="retryLoad" class="dest-retry" type="button" hidden>다시 불러오기</button></div>
</div>
</section></div></main>
<p id="mapStatus" class="dest-map-status" role="status"></p>
<script src="../../../2_common/3_api/api.js"></script>
<script src="../../../2_common/2_js/loading.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
<script src="./dest_rate.map.js"></script>
<script src="./dest_rate.dropdowns.js"></script>
</body></html>
